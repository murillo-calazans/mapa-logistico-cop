<title>Avança | Bairros de Atendimento</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
  :root{
    --page:      #0d0d0d;
    --surface:   #171716;
    --surface-2: #1f1f1e;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #8b8a83;
    --grid:      #2c2c2a;
    --border:    rgba(255,255,255,0.10);
    --accent:    #3987e5;

    --r1:#3987e5; --r2:#d95926; --r3:#199e70; --r4:#c98500; --r5:#d55181; --r6:#008300;
    /* slots livres pra novas regiões, no mesmo esquema categórico: --r7:#9085e9 (violeta) --r8:#e66767 (vermelho) */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column;
  }

  header{
    padding:20px 24px 16px;
    flex:0 0 auto;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg, var(--r1), var(--r3));
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:"Archivo", sans-serif; font-weight:800; font-size:14px; color:#fff;
  }
  h1{
    font-family:"Archivo", system-ui, sans-serif;
    font-weight:800;
    font-size:clamp(19px,2.4vw,25px);
    letter-spacing:-0.01em;
    margin:0;
  }
  .header-text{ display:flex; flex-direction:column; gap:3px; }
  .subtitle{ color:var(--ink-2); font-size:13.5px; margin:0; max-width:70ch; }
  .meta{
    color:var(--ink-muted);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    white-space:nowrap;
    align-self:center;
  }

  .search{ position:relative; margin-left:auto; width:min(280px, 46vw); }
  @media (max-width:840px){ .search{ margin-left:0; width:100%; } }
  .search input{
    width:100%; background:var(--surface-2); color:var(--ink);
    border:1px solid var(--border); border-radius:9px;
    padding:8px 12px 8px 32px;
    font-family:"IBM Plex Sans", sans-serif; font-size:13px;
    outline:none;
  }
  .search input:focus{ border-color:var(--accent); }
  .search input::placeholder{ color:var(--ink-muted); }
  .search svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; stroke:var(--ink-muted); pointer-events:none;
  }
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:1000;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    max-height:280px; overflow-y:auto;
  }
  .search-results:empty{ display:none; }
  .search-result{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; cursor:pointer; font-size:13px;
  }
  .search-result:hover, .search-result.active{ background:var(--surface-2); }
  .search-result .swatch{ box-shadow:none; }
  .search-result .r-name{ flex:1; }
  .search-result .r-region{ font-size:10.5px; color:var(--ink-muted); }

  .layout{ flex:1 1 auto; min-height:0; display:flex; gap:14px; padding:14px; }
  @media (max-width:840px){ .layout{ flex-direction:column; } .meta{ margin-left:0; } }

  #map{
    flex:1 1 auto; min-width:0; min-height:360px;
    border-radius:14px; border:1px solid var(--border);
    background:var(--surface-2);
  }

  .sidebar{
    flex:0 0 300px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px;
  }
  @media (max-width:840px){ .sidebar{ flex:0 0 auto; max-height:40vh; } }

  .sidebar h2{
    font-family:"Archivo", sans-serif; font-size:12.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted); margin:0 0 10px;
  }

  .city-folder + .city-folder{ margin-top:6px; }
  .city-header{
    display:flex; align-items:center; gap:8px; padding:8px;
    border-radius:10px; cursor:pointer;
  }
  .city-header:hover{ background:var(--surface-2); }
  .city-header input[type=checkbox]{ width:14px; height:14px; flex:0 0 auto; accent-color:var(--ink-2); }
  .city-icon{ width:15px; height:15px; flex:0 0 auto; color:var(--ink-muted); }
  .city-name{ font-family:"Archivo", sans-serif; font-weight:700; font-size:13.5px; flex:1; }
  .city-count{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--ink-muted); }
  .city-chevron{ width:11px; height:11px; flex:0 0 auto; color:var(--ink-muted); transition:transform 150ms ease; }
  .city-folder.collapsed .city-chevron{ transform:rotate(-90deg); }
  .city-regions{
    margin:2px 0 2px 14px; padding-left:10px;
    border-left:1px solid var(--border);
  }
  .city-folder.collapsed .city-regions{ display:none; }

  .region-row{ border:0; border-radius:10px; padding:8px; }
  .region-row + .region-row{ margin-top:2px; }
  .region-row:hover{ background:var(--surface-2); }
  .region-row.dimmed .row-top{ opacity:0.4; }
  .row-top{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .row-top input[type=checkbox]{ accent-color: var(--dot); width:14px; height:14px; flex:0 0 auto; }
  .swatch{ width:10px; height:10px; border-radius:50%; background:var(--dot); flex:0 0 auto; box-shadow:0 0 0 3px color-mix(in srgb, var(--dot) 25%, transparent); }
  .region-name{ font-weight:600; font-size:13.5px; flex:1; }
  .region-count{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--ink-muted); }
  .focus-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
    font-size:10.5px; font-family:"IBM Plex Mono", monospace; border-radius:6px;
    padding:2px 7px; cursor:pointer;
  }
  .focus-btn:hover{ color:var(--ink); border-color:var(--dot); }
  .bairro-chips{ margin:7px 0 2px 22px; display:flex; flex-wrap:wrap; gap:4px; }
  .chip{
    font-size:11px; color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--border); border-radius:999px; padding:2px 7px;
  }

  .footnote{
    margin:0 14px 14px; padding:12px 15px; font-size:12.5px; line-height:1.55; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
  }
  .footnote strong{ color:var(--ink); }
  .footnote code{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px;
  }

  .bairro-pin-wrap{ background:none; border:none; }
  .bairro-pin{ position:relative; width:100%; height:100%; }
  .bairro-pin::before{
    content:""; position:absolute; inset:0;
    background:var(--c);
    border:2px solid #0d0d0d;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.15);
  }
  .bairro-pin::after{
    content:""; position:absolute; left:50%; top:42%;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    background:#fff; border-radius:50%;
  }
  .bairro-pin.pin-hit::before{ animation: pinPulse 1s ease-out 2; }
  @keyframes pinPulse{
    0%   { box-shadow:0 2px 6px rgba(0,0,0,.6), 0 0 0 0 var(--c); }
    70%  { box-shadow:0 2px 6px rgba(0,0,0,.6), 0 0 0 14px transparent; }
    100% { box-shadow:0 2px 6px rgba(0,0,0,.6), 0 0 0 0 transparent; }
  }

  .leaflet-tooltip.bairro-label{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--ink);
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:11.5px;
    padding:3px 8px 3px 6px;
    border-radius:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
    white-space:nowrap;
  }
  .leaflet-tooltip.bairro-label::before{ display:none; }
  .bairro-label .tag-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:5px; vertical-align:middle;
  }

  .leaflet-control-attribution{
    background:rgba(23,23,22,0.85) !important;
    color:var(--ink-muted) !important;
  }
  .leaflet-control-attribution a{ color:var(--ink-2) !important; }
  .leaflet-control-zoom a{
    background:var(--surface) !important; color:var(--ink) !important; border-color:var(--border) !important;
  }
</style>
</head>

  // cor de cada região — mesma ordem categórica usada no resto do COP-Analytics
  const HEX = {
    1:"#3987e5", 2:"#d95926", 3:"#199e70", 4:"#c98500", 5:"#d55181", 6:"#008300",
    8:"#2dd4bf", 9:"#38bdf8",
    10:"#fb923c", 11:"#a3e635", 12:"#fbbf24", 13:"#f472b6", 14:"#c084fc",
    15:"#34d399", 16:"#f87171", 17:"#60a5fa", 18:"#facc15",
  };

  document.getElementById('metaCount').textContent = `${BAIRROS.length} bairros`;

  const map = L.map('map', { scrollWheelZoom:true });

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS'
  }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    pane: 'shadowPane'
  }).addTo(map);

  function bairroIcon(color){
    return L.divIcon({
      className: 'bairro-pin-wrap',
      html: `<div class="bairro-pin" style="--c:${color}"></div>`,
      iconSize: [20,20],
      iconAnchor: [10,20],
    });
  }

  const regionLayers = {};
  const allBounds = [];
  const searchIndex = []; // { name, regionId, regionName, lat, lon, marker }

  REGIONS.forEach(region=>{
    const items = BAIRROS.filter(b=>b[1]===region.id);
    const latlngs = items.map(b=>[b[2],b[3]]);
    const color = HEX[region.id];
    const group = L.layerGroup();

    items.forEach(([name, , lat, lon])=>{
      const marker = L.marker([lat, lon], { icon: bairroIcon(color) })
        .bindTooltip(
          `<span class="tag-dot" style="background:${color}"></span>${name}`,
          { permanent:true, direction:"right", offset:[6,-8], className:"bairro-label" }
        )
        .addTo(group);
      allBounds.push([lat, lon]);
      const cityName = CITIES.find(c => c.id === region.cityId)?.name ?? "";
      searchIndex.push({ name, regionId: region.id, regionName: region.name, cityName, color, lat, lon, marker });
    });

    group.addTo(map);
    regionLayers[region.id] = { group, bounds: L.latLngBounds(latlngs) };
  });

  map.fitBounds(L.latLngBounds(allBounds), { padding:[24,24] });

  // busca de bairro
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  function goToBairro(item){
    const checkbox = document.querySelector(`.region-row[data-region="${item.regionId}"] input[type=checkbox]`);
    if (checkbox && !checkbox.checked){ checkbox.checked = true; checkbox.dispatchEvent(new Event('change')); }

    map.flyTo([item.lat, item.lon], Math.max(map.getZoom(), 14), { duration:0.6 });

    const el = item.marker.getElement();
    const pin = el && el.querySelector('.bairro-pin');
    if (pin){
      pin.classList.remove('pin-hit');
      void pin.offsetWidth; // reinicia a animação se já rodou antes
      pin.classList.add('pin-hit');
    }

    searchResults.innerHTML = '';
    searchInput.value = item.name;
    searchInput.blur();
  }

  function renderResults(query){
    const q = query.trim().toLowerCase();
    if (!q){ searchResults.innerHTML = ''; return; }

    const matches = searchIndex
      .filter(item => item.name.toLowerCase().includes(q))
      .slice(0, 8);

    searchResults.innerHTML = matches.map((item, i) => `
      <div class="search-result" data-index="${i}">
        <span class="swatch" style="background:${item.color}"></span>
        <span class="r-name">${item.name}</span>
        <span class="r-region">${item.cityName} › ${item.regionName}</span>
      </div>
    `).join('');

    [...searchResults.children].forEach((row, i)=>{
      row.addEventListener('click', ()=> goToBairro(matches[i]));
    });
  }

  searchInput.addEventListener('input', ()=> renderResults(searchInput.value));
  searchInput.addEventListener('keydown', (e)=>{
    if (e.key === 'Enter'){
      const q = searchInput.value.trim().toLowerCase();
      const first = searchIndex.find(item => item.name.toLowerCase().includes(q));
      if (first) goToBairro(first);
    }
    if (e.key === 'Escape'){ searchResults.innerHTML=''; searchInput.blur(); }
  });
  document.addEventListener('click', (e)=>{
    if (!e.target.closest('.search')) searchResults.innerHTML = '';
  });

  // legenda — uma pasta por cidade, com as regiões dela dentro
  const FOLDER_ICON = `<svg class="city-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h4l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"></path></svg>`;
  const CHEVRON_ICON = `<svg class="city-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>`;

  function buildRegionRow(region){
    const count = BAIRROS.filter(b=>b[1]===region.id).length;
    const chips = BAIRROS.filter(b=>b[1]===region.id).map(b=>`<span class="chip">${b[0]}</span>`).join("");
    const color = HEX[region.id];

    const row = document.createElement('div');
    row.className = 'region-row';
    row.dataset.region = region.id;
    row.style.setProperty('--dot', color);
    row.innerHTML = `
      <div class="row-top">
        <input type="checkbox" checked>
        <span class="swatch"></span>
        <span class="region-name">${region.name}</span>
        <span class="region-count">${count}</span>
        <button class="focus-btn" type="button">focar</button>
      </div>
      <div class="bairro-chips" hidden>${chips}</div>
    `;

    const checkbox = row.querySelector('input');
    const nameEl = row.querySelector('.region-name');
    const chipsEl = row.querySelector('.bairro-chips');
    const focusBtn = row.querySelector('.focus-btn');

    checkbox.addEventListener('change', ()=>{
      const layer = regionLayers[region.id].group;
      if (checkbox.checked) map.addLayer(layer); else map.removeLayer(layer);
      row.classList.toggle('dimmed', !checkbox.checked);
    });

    nameEl.addEventListener('click', ()=>{
      chipsEl.hidden = !chipsEl.hidden;
    });

    focusBtn.addEventListener('click', ()=>{
      map.fitBounds(regionLayers[region.id].bounds, { padding:[40,40] });
    });

    return row;
  }

  const legend = document.getElementById('legend');
  CITIES.forEach(city=>{
    const cityRegions = REGIONS.filter(r => r.cityId === city.id);
    if (!cityRegions.length) return;
    const cityCount = BAIRROS.filter(b => cityRegions.some(r => r.id === b[1])).length;

    const folder = document.createElement('div');
    folder.className = 'city-folder';
    folder.dataset.city = city.id;

    const header = document.createElement('div');
    header.className = 'city-header';
    header.innerHTML = `
      <input type="checkbox" checked class="city-checkbox">
      ${FOLDER_ICON}
      <span class="city-name">${city.name}</span>
      <span class="city-count">${cityCount}</span>
      ${CHEVRON_ICON}
    `;
    folder.appendChild(header);

    const regionsWrap = document.createElement('div');
    regionsWrap.className = 'city-regions';
    cityRegions.forEach(region => regionsWrap.appendChild(buildRegionRow(region)));
    folder.appendChild(regionsWrap);

    const cityCheckbox = header.querySelector('.city-checkbox');
    cityCheckbox.addEventListener('click', e => e.stopPropagation());
    cityCheckbox.addEventListener('change', ()=>{
      regionsWrap.querySelectorAll('.region-row input[type=checkbox]').forEach(cb=>{
        if (cb.checked !== cityCheckbox.checked){ cb.checked = cityCheckbox.checked; cb.dispatchEvent(new Event('change')); }
      });
    });

    header.addEventListener('click', ()=> folder.classList.toggle('collapsed'));

    legend.appendChild(folder);
  });
</script>
